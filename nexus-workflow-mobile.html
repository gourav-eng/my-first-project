<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Nexus Workflow - Mobile Enhanced</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:0;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}@keyframes dash{to{stroke-dashoffset:-14}}@keyframes slide-in-from-bottom{from{transform:translateY(100%)}to{transform:translateY(0)}}.custom-scrollbar::-webkit-scrollbar{width:4px}.custom-scrollbar::-webkit-scrollbar-track{background:transparent}.custom-scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}.canvas-grid-clickable{pointer-events:auto!important}.touch-target{min-width:44px;min-height:44px}.bottom-sheet{animation:slide-in-from-bottom .3s ease-out}@media (max-width:768px){.desktop-only{display:none!important}header{padding:.75rem 1rem}button{min-width:44px;min-height:44px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useCallback}=React;const Icon=({name,className="w-5 h-5",...props})=>{useEffect(()=>{lucide.createIcons()},[]);return React.createElement('i',{'data-lucide':name,className,...props})};const THEMES={amber:{name:'Amber Glow',wrapper:'bg-[#fdfbf7] border-amber-200/80',header:'bg-[#fffbeb] border-amber-200',tag:'bg-amber-100/80 border-amber-300 text-amber-800',port:'bg-amber-500',text:'text-amber-900',line:'#f59e0b',groupBg:'bg-amber-50/10 border-amber-300/40',groupHeader:'bg-amber-100/40'},blue:{name:'Ocean Blue',wrapper:'bg-slate-50 border-blue-200/80',header:'bg-blue-50/80 border-blue-200',tag:'bg-blue-100/80 border-blue-300 text-blue-800',port:'bg-blue-500',text:'text-blue-900',line:'#3b82f6',groupBg:'bg-blue-50/10 border-blue-300/40',groupHeader:'bg-blue-100/40'},emerald:{name:'Mint Emerald',wrapper:'bg-emerald-50/20 border-emerald-200/80',header:'bg-emerald-50/80 border-emerald-200',tag:'bg-emerald-100/80 border-emerald-300 text-emerald-800',port:'bg-emerald-500',text:'text-emerald-900',line:'#10b981',groupBg:'bg-emerald-50/10 border-emerald-300/40',groupHeader:'bg-emerald-100/40'},purple:{name:'Royal Purple',wrapper:'bg-purple-50/20 border-purple-200/80',header:'bg-purple-50/80 border-purple-200',tag:'bg-purple-100/80 border-purple-300 text-purple-800',port:'bg-purple-500',text:'text-purple-900',line:'#8b5cf6',groupBg:'bg-purple-50/10 border-purple-300/40',groupHeader:'bg-purple-100/40'},rose:{name:'Blush Rose',wrapper:'bg-rose-50/20 border-rose-200/80',header:'bg-rose-50/80 border-rose-200',tag:'bg-rose-100/80 border-rose-300 text-rose-800',port:'bg-rose-500',text:'text-rose-900',line:'#f43f5e',groupBg:'bg-rose-50/10 border-rose-300/40',groupHeader:'bg-rose-100/40'}};const defaultWorkspaces=[{id:'ws-1',name:'Product Launch',groups:[{id:'g-1',name:'Phase 1',x:80,y:80,width:440,height:440,expanded:true,theme:'amber',parentGroupId:null}],nodes:[{id:'1',x:130,y:150,title:'User Research',content:'Gather feedback',expanded:true,theme:'amber',groupId:'g-1',status:'In Progress',priority:'High'},{id:'2',x:130,y:310,title:'Analysis',content:'Analyze data',expanded:true,theme:'blue',groupId:'g-1',status:'Todo',priority:'Medium'}],edges:[{id:'e1',source:'1',target:'2'}]}];

function WorkflowApp(){const[workspaces,setWorkspaces]=useState(defaultWorkspaces);const[activeTab,setActiveTab]=useState('ws-1');const[nextId,setNextId]=useState(10);const[viewMode,setViewMode]=useState('canvas');const[bottomSheet,setBottomSheet]=useState(null);const[transform,setTransform]=useState({x:0,y:0,scale:1});const[isPanning,setIsPanning]=useState(false);const[panStart,setPanStart]=useState({x:0,y:0});const[touchDistance,setTouchDistance]=useState(null);const[initialPinchScale,setInitialPinchScale]=useState(1);const workspaceRef=useRef(null);const isMobile=()=>window.innerWidth<768;const activeWs=workspaces.find(w=>w.id===activeTab)||workspaces[0];const nodes=activeWs?.nodes||[];const edges=activeWs?.edges||[];const groups=activeWs?.groups||[];const updateActiveWorkspace=useCallback((updater)=>{setWorkspaces(prev=>prev.map(ws=>ws.id===activeTab?{...ws,...updater(ws)}:ws))},[activeTab]);const addNode=()=>{const newNode={id:nextId.toString(),x:200,y:200,title:'New Task',content:'',expanded:true,theme:'amber',groupId:null,status:'Todo',priority:'Medium'};updateActiveWorkspace(ws=>({nodes:[...ws.nodes,newNode]}));setNextId(prev=>prev+1)};const updateNode=(id,updates)=>updateActiveWorkspace(ws=>({nodes:ws.nodes.map(n=>n.id===id?{...n,...updates}:n)}));const deleteNode=(id)=>updateActiveWorkspace(ws=>({nodes:ws.nodes.filter(n=>n.id!==id),edges:ws.edges.filter(e=>e.source!==id&&e.target!==id)}));const bringToFront=(id)=>updateActiveWorkspace(ws=>{const idx=ws.nodes.findIndex(n=>n.id===id);if(idx===-1)return ws;const newNodes=[...ws.nodes];const[node]=newNodes.splice(idx,1);newNodes.push(node);return{nodes:newNodes}});const sendToBack=(id)=>updateActiveWorkspace(ws=>{const idx=ws.nodes.findIndex(n=>n.id===id);if(idx===-1)return ws;const newNodes=[...ws.nodes];const[node]=newNodes.splice(idx,1);newNodes.unshift(node);return{nodes:newNodes}});const duplicateNode=(id)=>{const target=nodes.find(n=>n.id===id);if(!target)return;const dup={...target,id:nextId.toString(),x:target.x+40,y:target.y+40,title:`${target.title} (Copy)`};updateActiveWorkspace(ws=>({nodes:[...ws.nodes,dup]}));setNextId(prev=>prev+1)};const disconnectNodeLinks=(id)=>updateActiveWorkspace(ws=>({edges:ws.edges.filter(e=>e.source!==id&&e.target!==id)}));const handleTouchStart=useCallback((e)=>{if(e.touches.length===2){const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setTouchDistance(dist);setInitialPinchScale(transform.scale)}else if(e.touches.length===1){setIsPanning(true);setPanStart({x:e.touches[0].clientX-transform.x,y:e.touches[0].clientY-transform.y})}},[transform]);const handleTouchMove=useCallback((e)=>{if(e.touches.length===2&&touchDistance){e.preventDefault();const newDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const scaleChange=newDist/touchDistance;const newScale=Math.max(.2,Math.min(3,initialPinchScale*scaleChange));const centerX=(e.touches[0].clientX+e.touches[1].clientX)/2;const centerY=(e.touches[0].clientY+e.touches[1].clientY)/2;if(!workspaceRef.current)return;const rect=workspaceRef.current.getBoundingClientRect();const mouseX=centerX-rect.left;const mouseY=centerY-rect.top;const scaleFactor=newScale/transform.scale;setTransform({scale:newScale,x:mouseX-scaleFactor*(mouseX-transform.x),y:mouseY-scaleFactor*(mouseY-transform.y)})}else if(e.touches.length===1&&isPanning){e.preventDefault();setTransform(prev=>({...prev,x:e.touches[0].clientX-panStart.x,y:e.touches[0].clientY-panStart.y}))}},[touchDistance,initialPinchScale,isPanning,panStart,transform]);const handleTouchEnd=()=>{setIsPanning(false);setTouchDistance(null)};const handlePointerDown=(e)=>{if(e.button!==0)return;const isClickBg=e.target===workspaceRef.current||e.target.classList.contains('canvas-grid-clickable');if(isClickBg){setIsPanning(true);setPanStart({x:e.clientX-transform.x,y:e.clientY-transform.y})}};const handlePointerMove=(e)=>{if(isPanning){setTransform(prev=>({...prev,x:e.clientX-panStart.x,y:e.clientY-panStart.y}))}};const handlePointerUp=()=>{setIsPanning(false)};const drawCurve=(x1,y1,x2,y2)=>{const dx=Math.abs(x2-x1);const offset=Math.max(dx*.5,80);return`M ${x1} ${y1} C ${x1+offset} ${y1}, ${x2-offset} ${y2}, ${x2} ${y2}`};

return (<div className="flex flex-col h-screen w-full bg-[#f8fafc] font-sans text-slate-800 overflow-hidden"><header className="h-16 bg-white border-b border-slate-200 flex items-center px-6 shadow-sm z-50 justify-between shrink-0"><div className="flex items-center gap-3"><div className="p-2.5 bg-gradient-to-br from-indigo-600 to-indigo-800 rounded-xl text-white shadow-md"><Icon name="network" className="w-5 h-5"/></div><div><h1 className="text-base font-bold bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-600 leading-tight">Nexus Workflow</h1><p className="text-[10px] text-indigo-600 font-bold tracking-wider uppercase">MOBILE ENHANCED</p></div></div><div className="flex items-center gap-2"><div className="flex items-center bg-slate-100 rounded-lg p-1"><button onClick={()=>setViewMode('canvas')}className={`px-3 py-1.5 rounded-md text-xs font-semibold transition-all ${viewMode==='canvas'?'bg-white shadow-sm text-indigo-600':'text-slate-600'}`}><Icon name="maximize-2" className="w-4 h-4 inline mr-1"/>Canvas</button><button onClick={()=>setViewMode('outline')}className={`px-3 py-1.5 rounded-md text-xs font-semibold transition-all ${viewMode==='outline'?'bg-white shadow-sm text-indigo-600':'text-slate-600'}`}><Icon name="list" className="w-4 h-4 inline mr-1"/>Outline</button></div><button onClick={addNode}className="flex items-center px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg shadow-md transition-all"><Icon name="plus" className="w-4 h-4 mr-1.5"/>Add Node</button></div></header>{viewMode==='canvas'?(<main ref={workspaceRef}className="flex-1 relative overflow-hidden bg-[#fafafa] touch-none"onPointerDown={handlePointerDown}onPointerMove={handlePointerMove}onPointerUp={handlePointerUp}onPointerLeave={handlePointerUp}onTouchStart={handleTouchStart}onTouchMove={handleTouchMove}onTouchEnd={handleTouchEnd}style={{touchAction:'none'}}><div className="absolute inset-0 canvas-grid-clickable cursor-grab active:cursor-grabbing opacity-60"style={{backgroundImage:'radial-gradient(#94a3b8 1.5px, transparent 1.5px)',backgroundSize:`${24*transform.scale}px ${24*transform.scale}px`,backgroundPosition:`${transform.x}px ${transform.y}px`}}/><div className="absolute top-0 left-0 w-full h-full pointer-events-none"style={{transform:`translate(${transform.x}px,${transform.y}px) scale(${transform.scale})`,transformOrigin:'0 0'}}><svg className="absolute overflow-visible w-full h-full z-0"><defs>{Object.entries(THEMES).map(([key,theme])=>(<marker key={key}id={`arrow-${key}`}markerWidth="6"markerHeight="6"refX="5"refY="3"orient="auto"><polygon points="0 0, 6 3, 0 6"fill={theme.line}/></marker>))}</defs>{edges.map(edge=>{const sourceNode=nodes.find(n=>n.id===edge.source);const targetNode=nodes.find(n=>n.id===edge.target);if(!sourceNode||!targetNode)return null;const theme=THEMES[sourceNode.theme]||THEMES.amber;return(<g key={edge.id}className="cursor-pointer group"><path d={drawCurve(sourceNode.x+340,sourceNode.y+24,targetNode.x,targetNode.y+24)}stroke={theme.line}strokeWidth={3}fill="none"markerEnd={`url(#arrow-${sourceNode.theme||'amber'})`}/></g>)})}</svg>{nodes.map((node,index)=>{const theme=THEMES[node.theme]||THEMES.amber;return(<div key={node.id}className={`absolute rounded-xl border w-[340px] flex flex-col pointer-events-auto bg-white/95 backdrop-blur-sm shadow-md ${theme.wrapper}`}style={{left:node.x,top:node.y,width:340,zIndex:50+index}}onClick={(e)=>{e.stopPropagation();if(isMobile()){setBottomSheet({nodeId:node.id})}}}><div className={`absolute -top-3.5 left-5 px-3 py-0.5 rounded-full text-[10px] font-bold shadow-sm border flex items-center gap-1.5 z-20 ${theme.tag}`}><Icon name="file-text" className="w-3.5 h-3.5"/>TASK {node.id}</div><div className={`flex items-center justify-between px-3 h-12 rounded-t-xl border-b select-none ${theme.header}`}><div className="flex items-center gap-2 flex-1 overflow-hidden"><Icon name="grip-horizontal" className="w-3.5 h-3.5 text-slate-400"/>  <input className="bg-transparent font-bold focus:outline-none focus:bg-white/80 rounded px-1.5 w-full text-xs text-slate-800"value={node.title||''}onChange={(e)=>updateNode(node.id,{title:e.target.value})}/></div><div className="flex items-center gap-0.5"><button onClick={()=>updateNode(node.id,{expanded:!node.expanded})}className="p-1 hover:bg-white/50 rounded text-slate-500"><Icon name={node.expanded?"chevron-down":"chevron-right"}className="w-3.5 h-3.5"/></button><button onClick={()=>deleteNode(node.id)}className="p-1 hover:bg-red-100 hover:text-red-600 rounded text-slate-400"><Icon name="x" className="w-3.5 h-3.5"/></button></div></div>{node.expanded&&(<div className="p-4 flex flex-col gap-3"><textarea className="w-full h-full min-h-[4rem] bg-transparent resize-none focus:outline-none text-slate-600 text-xs leading-relaxed"value={node.content||''}onChange={(e)=>updateNode(node.id,{content:e.target.value})}placeholder="Write details..."/><div className="flex justify-between items-center pt-2.5 border-t border-slate-100 gap-2"><div className="flex flex-col gap-1"><span className="text-[9px] font-bold text-slate-400 uppercase">Status</span><select className="text-xs bg-slate-50 border border-slate-200 rounded px-1 py-0.5 font-bold"value={node.status||'Todo'}onChange={(e)=>updateNode(node.id,{status:e.target.value})}><option value="Todo">📌 Todo</option><option value="In Progress">⚡ In Progress</option><option value="Done">✅ Done</option></select></div><div className="flex flex-col gap-1"><span className="text-[9px] font-bold text-slate-400 uppercase">Priority</span><select className="text-xs bg-slate-50 border border-slate-200 rounded px-1 py-0.5 font-bold"value={node.priority||'Medium'}onChange={(e)=>updateNode(node.id,{priority:e.target.value})}><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">🔥 High</option></select></div></div></div>)}</div>)})}</div></main>):(<div className="flex-1 overflow-y-auto bg-slate-50 p-4"><div className="max-w-4xl mx-auto"><h2 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2"><Icon name="list" className="w-6 h-6 text-indigo-600"/>Outline Board View</h2>{nodes.map(node=>{const theme=THEMES[node.theme]||THEMES.amber;return(<div key={node.id}className={`p-4 rounded-xl border-2 mb-3 ${theme.wrapper}`}><div className="flex items-start justify-between gap-3 mb-3"><input className="flex-1 font-bold text-base bg-transparent focus:outline-none focus:bg-white/50 rounded px-2 py-1"value={node.title||''}onChange={(e)=>updateNode(node.id,{title:e.target.value})}placeholder="Task title..."/><button onClick={()=>deleteNode(node.id)}className="p-2 hover:bg-red-50 rounded-lg text-red-500"><Icon name="trash-2" className="w-4 h-4"/></button></div><div className="grid grid-cols-2 gap-2 mb-3"><div><label className="text-xs font-bold text-slate-500 block mb-1">Status</label><select className="w-full text-sm bg-white border border-slate-200 rounded-lg px-3 py-2 font-semibold"value={node.status||'Todo'}onChange={(e)=>updateNode(node.id,{status:e.target.value})}><option value="Todo">📌 Todo</option><option value="In Progress">⚡ In Progress</option><option value="Done">✅ Done</option></select></div><div><label className="text-xs font-bold text-slate-500 block mb-1">Priority</label><select className="w-full text-sm bg-white border border-slate-200 rounded-lg px-3 py-2 font-semibold"value={node.priority||'Medium'}onChange={(e)=>updateNode(node.id,{priority:e.target.value})}><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">🔥 High</option></select></div></div><textarea className="w-full text-sm bg-white/50 border border-slate-200 rounded-lg px-3 py-2 min-h-[80px] resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500"value={node.content||''}onChange={(e)=>updateNode(node.id,{content:e.target.value})}placeholder="Task description..."/></div>)})}</div></div>)}{bottomSheet&&isMobile()&&(<BottomSheetActionPanel nodeId={bottomSheet.nodeId}node={nodes.find(n=>n.id===bottomSheet.nodeId)}onClose={()=>setBottomSheet(null)}onBringToFront={bringToFront}onSendToBack={sendToBack}onDuplicate={duplicateNode}onDisconnect={disconnectNodeLinks}onDelete={deleteNode}onThemeChange={(nodeId,theme)=>updateNode(nodeId,{theme})}/>)}</div>)}

ReactDOM.render(<WorkflowApp/>,document.getElementById('root'));
</script>
</body>
